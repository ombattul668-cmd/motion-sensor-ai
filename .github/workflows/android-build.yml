name: Build Android Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle CLI
        uses: gradle/actions/setup-gradle@v4

      - name: Create Gradle Wrapper if it is missing
        run: |
          if [ ! -f gradlew ] || [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version "${GRADLE_VERSION:-8.5}"
          fi
          chmod +x gradlew
          ./gradlew --version

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: 

      - name: Install Android SDK components
        run: |
          echo "y" | sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Download MediaPipe hand model if missing
        run: |
          if [ ! -s "$MODEL_PATH" ]; then
            curl -fL --retry 3 --retry-delay 5 -o "$MODEL_PATH" "$MODEL_URL"
          fi
          SIZE=$(stat -c%s "$MODEL_PATH")
          echo "Model size: $SIZE bytes"
          if [ "$SIZE" -lt 1000000 ]; then
            echo "::error::hand_landmarker.task is missing or too small"
            exit 1
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
